# ---------------------------------------------------------------------------
# "GO FAST" SETTINGS FOR BULK DATA LOADING
# WARNING: Do not use these settings on a real production database
# ---------------------------------------------------------------------------

# Turn off the most expensive safety check. This tells Postgres not to
# wait for the operating system to confirm the data is physically on the disk.
fsync = off

# Tell Postgres not to wait for write-ahead log (WAL) records to be written
# to disk before considering a transaction committed.
synchronous_commit = off

# Another safety feature that we can disable for a bulk load.
full_page_writes = off

# Give more memory to maintenance operations like loading data.
maintenance_work_mem = 1GB